name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test
        run: go test ./... -count=1 -short -timeout=120s

      - name: Vet
        run: go vet ./...

      - name: Build CLI
        run: go build -tags grammar_blobs_external -o /dev/null ./cmd/arbiter

      - name: Build Agent
        run: go build -tags grammar_blobs_external -o /dev/null ./cmd/arbiter-agent

      - name: Build Runtime
        run: go build -tags grammar_blobs_external -o /dev/null ./cmd/arbiter-runtime

      - name: Build LSP
        run: go build -tags grammar_blobs_external -o /dev/null ./cmd/arbiter-lsp

      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build -tags grammar_blobs_external -o /dev/null ./cmd/arbiter-wasm

      - name: Check grammar
        run: go run ./cmd/arbiter check testdata/fraud.arb

  # Advisory: probes the latest gotreesitter release against this repo's own
  # grammar. It regenerates grammar.bin with the latest toolchain (parse
  # tables are tied to the exact gotreesitter version that built them — see
  # TestGrammarBinIsCurrent and TestGoldenParseResults) and runs the full
  # suite against it. This job does not gate merges: it is a compatibility
  # canary so a gotreesitter behavior change (stricter GLR error recovery,
  # renamed grammar nodes, and so on) surfaces here first, before a real
  # version bump. A failure here means: read the diff, decide whether to
  # bump go.mod and update any affected golden values, or file an issue
  # upstream.
  gotreesitter-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Bump gotreesitter to latest
        run: go get github.com/odvcencio/gotreesitter@latest

      - name: Regenerate grammar.bin against latest gotreesitter
        run: go run ./cmd/arbiter-grammar

      - name: Test against latest gotreesitter
        run: go test ./... -count=1 -short -timeout=120s

      - name: Vet against latest gotreesitter
        run: go vet ./...
